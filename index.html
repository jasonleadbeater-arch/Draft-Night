<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Draft</title>
<style>
:root{--bg:#14161a;--fg:#e8e8e8;--card:#1f2329;--acc:#c9a227}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1200px;margin:auto;padding:12px}
.bar{display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--card);border-radius:8px;margin-bottom:12px}
.box{background:var(--card);padding:12px;border-radius:8px;margin-bottom:12px}
input,button{padding:8px 12px;border-radius:6px;border:1px solid #444;background:#2a2f37;color:var(--fg);margin:3px}
button{cursor:pointer;background:var(--acc);color:#111;border:0;font-weight:600}
button:disabled{opacity:.5}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.c{width:150px;border-radius:8px;cursor:pointer;transition:transform .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#zoom{position:fixed;top:50%;transform:translateY(-50%);width:320px;border-radius:14px;box-shadow:0 8px 30px #000a;pointer-events:none;display:none;z-index:99}
.s{width:100px}
.t{width:42px}
.tap{transform:rotate(90deg);margin:0 18px}
</style></head>
<body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body></html>
